<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>breathing exercises</title>
  <meta name="description" content="two breathing exercises you can actually follow: box breathing and the physiological sigh. a study by levi adissi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E3E7DF'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%234F6E5B'/%3E%3C/svg%3E">
  <style>
    @font-face{
      font-family:"Aspekta";
      font-weight:100 900;
      font-style:normal;
      font-display:swap;
      src:url("https://cdn.jsdelivr.net/gh/ivodolenc/aspekta@cd08efde1a0484c3626818ac59a6933e59f71531/packages/fonts/variable/AspektaVF.woff2") format("woff2");
    }

    :root{
      color-scheme:light;

      /* The same paper form.html holds and still.html surfaces into. No ground
         ramp here either: the page has no journey, it has a practice. */
      --paper:#F2EFE6;
      --paper-ink:#171512;   /* 15.85:1 on --paper */
      --paper-muted:#5F5C54; /* 5.8:1 */
      --paper-line:#DFDACE;
      --pill-fill:#D3E9E6;   /* teal tint, 1.1:1 on --paper */
      --pill-ink:#0F5C56;    /* 6.17:1 on --pill-fill */
      --pill-glint:rgba(255,255,255,.95); /* behind the words, so it only lifts the ink's contrast */

      --body:"Aspekta",ui-sans-serif,system-ui,sans-serif;

      /* Three small, one large, nothing between 18 and 47. The one large size
         is the reduced-motion countdown, which is the only thing on the page
         that has to be readable from across a room. */
      --t-count:clamp(47px,13vw,64px);
      --t-lede:18px;
      --t-body:15px;
      --t-small:13px;

      --dur-ui:160ms;
      --ease-ui:cubic-bezier(.4,0,.2,1);
      --dur-scene:600ms;
      --ease-scene:cubic-bezier(.19,1,.22,1);

      --s1:8px;--s2:16px;--s3:24px;--s4:40px;
      --col:min(640px,calc(100vw - 48px));
    }

    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{
      margin:0;
      height:100dvh; /* dvh, not vh: ios safari's toolbar owns the difference */
      position:relative;
      background:var(--paper);
      color:var(--paper-ink);
      font:400 var(--t-body)/1.55 var(--body);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow:hidden;
      overscroll-behavior:none;
    }
    p{margin:0}
    a{color:inherit}
    ::selection{background:var(--paper-ink);color:var(--paper)}

    main{position:absolute;inset:0}

    /* Two screens, one file. They crossfade on the scene beat and the one that
       is not on screen is inert, so a tab never lands on a hidden control. */
    .layer{
      position:absolute;inset:0;
      display:flex;flex-direction:column;
      padding:18px 24px 20px;
      opacity:0;pointer-events:none;
      transition:opacity var(--dur-scene) var(--ease-scene);
    }
    .layer.is-on{opacity:1;pointer-events:auto}

    .mast{
      display:flex;justify-content:space-between;align-items:flex-start;
      gap:var(--s3);
      flex:none;
      font-size:var(--t-small);
      color:var(--paper-muted);
    }
    .mast-title{
      font-size:var(--t-lede);font-weight:600;
      letter-spacing:-.02em;line-height:1.2;
      color:var(--paper-ink);
    }
    .sub{margin-top:4px;max-width:34ch}
    .mast-me{flex:none;padding-top:2px}

    /* ---- menu ---- */

    /* A list, not cards: hairlines and text. Nothing here is a tile, nothing
       here has an icon, and the descriptions carry the weight. */
    .list{
      flex:1;min-height:0;
      display:flex;flex-direction:column;justify-content:center;
      width:var(--col);margin:0 auto;
    }
    .list button{
      appearance:none;background:none;border:0;
      border-top:1px solid var(--paper-line);
      display:block;width:100%;margin:0;padding:14px 0 0;
      font:inherit;color:var(--paper-muted);text-align:left;cursor:pointer;
      transition:color var(--dur-ui) var(--ease-ui);
    }
    .list > :last-child{border-bottom:1px solid var(--paper-line)}
    .list button:hover{color:var(--paper-ink)}
    .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
    .row-name{color:var(--paper-ink)}
    .row-time{flex:none;font-size:var(--t-small)}
    .row-line{display:block;margin-top:3px;font-size:var(--t-small);line-height:1.5}
    .row-pill{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1);margin:0;padding:var(--s1) 0 15px;font-size:var(--t-small);line-height:1.5;color:var(--paper-muted)}
    .badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border:1px solid transparent;border-radius:9999px;background:var(--pill-fill);color:var(--pill-ink);font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
    .row-pill a{color:var(--paper-ink);text-underline-offset:2px}
    .badge{position:relative;overflow:hidden;isolation:isolate}
    .badge-word{position:relative;z-index:1}
    .glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 42.7%,var(--pill-glint) 50%,transparent 57.3%) 100% 0/300% 100% no-repeat}

    .foot{flex:none;text-align:center}
    .back{
      color:var(--paper-muted);
      text-decoration:underline;text-underline-offset:3px;
      transition:opacity var(--dur-ui) var(--ease-ui);
    }
    .back:hover,.back:focus-visible{opacity:.6}
    .back{position:relative}
    .back::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}

    /* ---- guide ---- */

    /* The stage owns everything between the two ends of the screen, so the disc
       can be sized against its own box and can never reach the copy. */
    .stage{flex:1;min-height:0;position:relative}
    .stage canvas{
      position:absolute;inset:0;width:100%;height:100%;
      display:block;
      touch-action:none; /* the page does not scroll, so a finger here is a tap */
    }
    .count{
      position:absolute;inset:0;
      display:grid;place-items:center;
      font-size:var(--t-count);font-weight:300;
      letter-spacing:-.02em;line-height:1;
      font-variant-numeric:tabular-nums; /* the number must not shuffle as it counts */
      color:var(--paper-ink);
      pointer-events:none;
    }
    .count[hidden]{display:none}

    .tray{
      flex:none;
      display:flex;flex-direction:column;align-items:center;gap:12px;
      width:var(--col);margin:0 auto;
    }
    /* still.html's phase track, verbatim in shape: the words in a row, one thin
       bar under them, filled across the phase that is running. */
    .phase{
      display:flex;flex-direction:column;align-items:stretch;gap:12px;
      font-size:var(--t-small);
      color:var(--paper-muted);
    }
    .phase-words{
      display:flex;flex-wrap:wrap;justify-content:center;
      gap:clamp(20px,6vw,var(--s4));
    }
    .phase-words span{transition:color var(--dur-scene) var(--ease-scene)}
    .phase-words span.is-now{color:var(--paper-ink)}
    /* The track spans the words rather than sitting at a fixed width under the
       middle of them: a 132px bar under a four word row reads as an underline
       on whichever word it happens to land beneath. */
    .phase-track{width:100%;min-width:132px;height:2px;background:var(--paper-line)}
    .phase-track i{
      display:block;width:100%;height:100%;
      background:var(--paper-ink);
      transform:scaleX(0);transform-origin:left;
    }
    .cycle{font-size:var(--t-small);color:var(--paper-muted)}

    .go{
      appearance:none;background:none;
      border:1px solid var(--paper-line);border-radius:2px;
      margin:0;padding:9px 22px;
      font:inherit;color:var(--paper-ink);cursor:pointer;
      transition:border-color var(--dur-ui) var(--ease-ui);
    }
    .go:hover{border-color:var(--paper-ink)}

    /* `back` leaves the guide for the menu. It is an action, not a destination,
       so it is a button: browser-back would leave the page entirely. */
    .linkish{
      appearance:none;background:none;border:0;margin:0;padding:0;
      font:inherit;font-size:var(--t-small);color:var(--paper-muted);cursor:pointer;
      text-decoration:underline;text-underline-offset:3px;
      transition:opacity var(--dur-ui) var(--ease-ui);
    }
    .linkish:hover{opacity:.6}
    .linkish{position:relative}
    .linkish::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
    .linkish{z-index:1}

    :where(button,a):focus-visible{
      outline:2px solid var(--paper-ink);
      outline-offset:3px;
    }

    .sr{
      position:absolute;width:1px;height:1px;
      margin:-1px;padding:0;border:0;
      overflow:hidden;clip-path:inset(50%);white-space:nowrap;
    }

    @media (prefers-reduced-motion:reduce){
      .glint{background-position:59% 0}
      .layer,.list button,.phase-words span,.back,.go,.linkish{transition-duration:.01ms}
    }
:root{color-scheme:light;--paper:#E3E7DF;--paper-ink:#18211C;--paper-muted:#536059;--paper-line:#CBD2C7;--pill-fill:#CCDACB;--pill-ink:#2C5741;--pill-glint:rgba(255,255,255,.9);--disc:#4F6E5B;--disc-a:0.5}

  :root{
    --surface:#F4F6F1;      /* card, 1.1:1 on --paper; muted 6.06:1 on it */
    --accent:#2C5741;       /* the one filled primary; white on it 8.25:1 */
    --on-accent:#FFFFFF;
    --accent-tint:#DCE5D9;  /* selected fill; accent ink 6.38:1, muted 5.1:1 on it */
    --radius:8px;
    --shadow-card:0 1px 2px rgba(24,33,28,.06),0 2px 8px -2px rgba(24,33,28,.08);
  }
  .type-page-title{font-size:32px;line-height:40px;font-weight:400;letter-spacing:-.01em;color:var(--paper-ink);margin:0}
  .type-card-title{font-size:16px;line-height:24px;font-weight:600;color:var(--paper-ink)}
  .type-body{font-size:14px;line-height:20px}
  .type-meta{font-size:13px;line-height:18px;color:var(--paper-muted)}
  .num{font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow-card)}

  .btn{appearance:none;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
       height:36px;padding:0 16px;border-radius:var(--radius);border:1px solid transparent;
       font:500 14px/1 var(--body);cursor:pointer;
       transition:background-color var(--dur-ui) var(--ease-ui),border-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui)}
  .btn::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
  .btn-ghost{background:none;color:var(--paper-ink);padding:0 10px;margin-left:-10px}
  .btn-ghost:hover{background:var(--accent-tint)}
  .btn-ghost svg{width:16px;height:16px}

  /* The phase words as a segmented row: the running phase takes the selected fill. */
  .phase{gap:10px;width:100%}
  .phase-words{gap:4px;flex-wrap:nowrap}
  .phase-words span{flex:1;text-align:center;padding:6px 10px;border-radius:6px;font-size:13px;line-height:18px;
       transition:background-color var(--dur-scene) var(--ease-scene),color var(--dur-scene) var(--ease-scene)}
  .phase-words span.is-now{background:var(--accent-tint);color:var(--accent)}
  /* Levi 10-26: the running phase has to be obvious at a glance. It leads by weight and size as well as the chip,
     the same rule the picker follows (Carbon, Stripe): semibold, 15px, in the accent; the rest stay regular and grey.
     Each word keeps its own equal column, so the change never moves its neighbours. */
  .phase-words span.is-now{font-weight:600;font-size:15px}
  .phase-track{height:4px;border-radius:2px;overflow:hidden}
  .phase-track i{background:var(--accent)}
  .cycle{font-variant-numeric:tabular-nums}

  /* begin / end / again: the view's one filled primary */
  .go{height:44px;width:100%;max-width:320px;border:0;border-radius:var(--radius);
      background:var(--accent);color:var(--on-accent);font-weight:500;font-size:15px;padding:0 24px}
  .go:hover{border:0;background:#24493A}
  .tray{gap:16px;max-width:400px}
  :where(button,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.btn,.phase-words span{transition-duration:.01ms}}

  #menu{display:none}
  .layer{padding:16px 24px 24px}
  #guide .mast{align-items:center}
  #guide .mast-title{display:none}
  .linkish{display:none}
  .pick{width:var(--col);margin:24px auto 0;display:flex;flex-direction:column;gap:16px}
  .seg{display:flex;padding:3px;gap:3px;border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--surface)}
  .seg button{appearance:none;position:relative;flex:1;height:36px;border:0;border-radius:6px;background:none;
       font:500 14px/1 var(--body);color:var(--paper-muted);cursor:pointer;
       transition:background-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui)}
  .seg button::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
  .seg button:hover{color:var(--paper-ink)}
  .seg button[aria-selected="true"]{background:var(--accent-tint);color:var(--accent)}
  .facts{display:flex;flex-direction:column;gap:8px}
  .facts .top{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
  .facts .top .num{flex:none;white-space:nowrap} /* the time on one line on a phone; the description takes the wrap */
  .facts .row-pill{padding:0}
  .facts a{color:var(--paper-ink);text-underline-offset:2px}
  .stage{margin:8px 0}
  #guide .mast .back{order:-1}
  @media (prefers-reduced-motion:reduce){.seg button{transition-duration:.01ms}}

  /* Levi 10-26: the pill and its line live in the tab, so the facts row is gone. The tab is a card holding the
     button, the pill and the line; the button's hit area covers the whole card and the link sits above it. */
  .seg{padding:4px;gap:4px;align-items:stretch}
  .tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
       padding:10px 12px 12px;border-radius:6px;
       transition:background-color var(--dur-ui) var(--ease-ui)}
  .tab:has([aria-selected="true"]){background:var(--accent-tint)}
  .seg .tab button{position:static;flex:none;height:auto;padding:0;border-radius:0;background:none;text-align:left;
       font:500 14px/20px var(--body)}
  .seg .tab button::after{inset:0;height:auto;transform:none;border-radius:6px}
  .tab:hover button{color:var(--paper-ink)}
  .seg .tab button[aria-selected="true"]{background:none;color:var(--accent)}
  .tab-line{margin:0;font-size:13px;line-height:18px;color:var(--paper-muted)}
  /* The pill is a link to the study. A lit fill with a soft rim and a glint across it; the ink stays dark on the
     lightest-to-darkest fill, so the shine can only add contrast. The hit area grows to 44px past the pill. */
  .pill-link{position:relative;z-index:1;display:inline-flex;border-radius:9999px;text-decoration:none;
       transition:transform var(--dur-ui) var(--ease-ui),box-shadow var(--dur-ui) var(--ease-ui)}
  /* A tag, not a button: 22px tall. The tap area still reaches 44px, mostly downward into the card's padding so
     it does not cover the exercise name above it. */
  .pill-link::after{content:"";position:absolute;inset:-6px -4px -16px}
  .tab .badge{height:22px;gap:4px;padding:0 7px 0 9px;font-size:12px;font-weight:500;color:var(--accent);
       background:linear-gradient(180deg,#EEF4EB 0%,#D2E2CE 60%,#C6D9C2 100%);
       border:1px solid rgba(44,87,65,.22);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 1px rgba(24,33,28,.06)}
  .tab .glint{background-image:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%)}
  .pill-arrow{position:relative;z-index:1;width:9px;height:9px;flex:none;opacity:.75}
  .pill-link:hover .pill-arrow{opacity:1}

  /* Two bars. The top one is this cycle, one segment per phase under its word; the bottom one is the whole
     session, one segment per cycle, over "cycle 2 of 4". */
  .phase-track,.session-track{display:flex;gap:4px;height:4px;background:none;border-radius:0;overflow:visible}
  .phase-track i,.session-track i{display:block;flex:1;width:auto;height:100%;border-radius:2px;overflow:hidden;
       background:var(--paper-line);transform:none}
  .phase-track b,.session-track b{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
  .session{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
  .session-track{width:100%;height:2px;margin-top:6px}
  /* On a phone the tabs wrap to several lines, so the sheet above the disc gives back what it can. */
  @media (max-width:480px){
    .pick{margin-top:12px;gap:12px}
    .tab{padding:8px 10px 10px;gap:6px}
    .tray{gap:12px}
    .session{gap:8px}
  }
  .session-track b{background:var(--paper-ink)}

  @media (prefers-reduced-motion:reduce){.tab{transition-duration:.01ms}}
  /* ---- Levi 10-26 round 3 (mock options) ----
     The tag is a detail, not a button: no arrow, no border, no drop shadow. A soft tint with a small four point
     spark that twinkles, and a glint that passes over the fill. It still opens the study. */
  .tab .badge{height:20px;gap:4px;padding:0 8px 0 6px;border:0;font-size:12px;font-weight:500;color:var(--accent);
       background:linear-gradient(180deg,#E9F0E5 0%,#D9E5D5 100%);box-shadow:inset 0 0 0 1px rgba(44,87,65,.10)}
  .spark{position:relative;z-index:1;width:9px;height:9px;flex:none;color:var(--accent);transform-origin:50% 50%}
  .pill-link:hover .spark,.pill-link:focus-visible .spark{animation:twinkle 900ms var(--ease-scene)}
  @keyframes twinkle{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.35) rotate(45deg)}100%{transform:scale(1) rotate(90deg)}}
  .pill-link{transition:none}
  .pill-link:hover .badge{background:linear-gradient(180deg,#E3ECDF 0%,#D2E1CD 100%)}
  @media (prefers-reduced-motion:reduce){.pill-link:hover .spark,.pill-link:focus-visible .spark{animation:none}}

  /* tag layout a: one row per tab, the name on the left and the tag on the right. */
  html[data-tag="a"] .tab{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 14px;min-height:44px}
  html[data-tag="a"] .pill-link::after{inset:-12px -6px}
  @media (max-width:520px){html[data-tag="a"] .tab{flex-direction:column;align-items:flex-start;gap:6px;padding:9px 10px 10px}
    html[data-tag="a"] .pill-link::after{inset:-6px -4px -14px}}

  /* tag layout b: a compact segmented control, centred, the tag tucked under the name. */
  html[data-tag="b"] .tab{align-items:center;text-align:center;gap:5px;padding:9px 10px 11px}
  html[data-tag="b"] .seg .tab button{text-align:center}
  html[data-tag="b"] .pill-link::after{inset:-4px -4px -12px}

  /* tag layout c: no box at all. Two names as text tabs with a hairline under the picked one, each tag beside
     its name like a footnote. */
  html[data-tag="c"] .seg{background:none;border:0;box-shadow:none;padding:0;gap:28px;border-bottom:1px solid var(--paper-line);border-radius:0}
  html[data-tag="c"] .tab{flex:none;flex-direction:row;align-items:center;gap:8px;padding:10px 0 12px;border-radius:0;background:none}
  html[data-tag="c"] .tab:has([aria-selected="true"]){background:none}
  html[data-tag="c"] .tab::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);
       transform:scaleX(0);transition:transform var(--dur-scene) var(--ease-scene)}
  html[data-tag="c"] .tab:has([aria-selected="true"])::before{transform:scaleX(1)}
  html[data-tag="c"] .seg .tab button{font-size:15px}
  html[data-tag="c"] .seg .tab button[aria-selected="true"]{color:var(--paper-ink)}
  html[data-tag="c"] .pill-link::after{inset:-12px -6px}
  @media (max-width:520px){html[data-tag="c"] .seg{gap:20px}html[data-tag="c"] .tab{flex-direction:column;align-items:flex-start;gap:4px}
    html[data-tag="c"] .pill-link::after{inset:-4px -4px -12px}}
  @media (prefers-reduced-motion:reduce){html[data-tag="c"] .tab::before{transition-duration:.01ms}}


  /* ---- Levi 10-26 round 4 ---- */
  /* The tag: smaller, and part of the tab, so it never takes a tap somewhere else. */
  .pill-link{pointer-events:none}
  .pill-link::after{display:none}
  .tab .badge{height:18px;gap:3px;padding:0 7px 0 5px;font-size:11px;letter-spacing:.01em}
  .spark{width:8px;height:8px}
  .tab:hover .spark{animation:twinkle 900ms var(--ease-scene)}
  @media (prefers-reduced-motion:reduce){.tab:hover .spark{animation:none}}

  /* The tray: the session line on top (cycle left, time left right), the words, one bar, begin, the study. */
  .tray{gap:12px}
  .meta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;line-height:18px;color:var(--paper-muted)}
  .meta p{margin:0}
  .cycle{display:inline-flex;align-items:center;gap:6px;min-width:0;text-align:left}
  .left{font-variant-numeric:tabular-nums}
  .is-running .cycle{color:var(--paper-ink)}
  .tick{width:14px;height:14px;flex:none}
  .tick path{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
       stroke-dasharray:14;stroke-dashoffset:14;animation:tick-in 520ms 120ms cubic-bezier(.65,0,.35,1) forwards}
  @keyframes tick-in{to{stroke-dashoffset:0}}
  .is-done .cycle{color:var(--accent)}
  .phase{gap:10px;width:100%}
  .phase-words span{transition:background-color var(--dur-scene) var(--ease-scene),color var(--dur-scene) var(--ease-scene)}
  .bar{position:relative;width:100%;height:4px;border-radius:2px;background:var(--paper-line);overflow:hidden}
  .bar i{position:absolute;inset:0;border-radius:2px;transform-origin:left;background:var(--accent)}
  .bar-fill{transform:scaleX(0)}
  /* a soft light at the leading edge of the fill */
  .bar-fill::after{content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:16px;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));opacity:0;transition:opacity var(--dur-ui) var(--ease-ui)}
  .is-running .bar-fill::after{opacity:1}
  .bar-ghost{opacity:0}
  .study{color:var(--paper-muted);text-decoration:underline;text-decoration-color:var(--paper-line);text-underline-offset:3px;
       position:relative;transition:color var(--dur-ui) var(--ease-ui)}
  .study:hover{color:var(--paper-ink);text-decoration-color:currentColor}
  .study::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:44px;transform:translate(-50%,-50%)}
  @media (max-width:480px){.tray{gap:10px}}
  @media (prefers-reduced-motion:reduce){.tick path{animation:none;stroke-dashoffset:0}.study,.bar-fill::after{transition-duration:.01ms}}

  /* Picker hierarchy, from the Carbon and Stripe read (RESEARCH/BREATHE_PICKER_HIERARCHY_CARBON_STRIPE.md): the
     name leads by weight and ink, the tag is a quiet second line in its name's own colour, 4px under it, and the
     picked option changes weight as well as fill. Carbon's productive easing for the switch. */
  .seg{padding:4px;gap:4px}
  .tab{gap:4px;padding:12px 16px;transition:background-color 110ms cubic-bezier(.2,0,.38,.9)}
  .seg .tab button{font:400 14px/20px var(--body);color:var(--paper-muted);transition:color 110ms cubic-bezier(.2,0,.38,.9)}
  .seg .tab button[aria-selected="true"]{font-weight:600;color:var(--paper-ink)}
  .tab .badge{height:18px;padding:0 7px 0 6px;font-weight:400;color:var(--paper-muted);
       background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px var(--paper-line)}
  .tab:has([aria-selected="true"]) .badge{color:var(--paper-ink);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(44,87,65,.18)}
  .spark{color:currentColor;opacity:.7}
  .tab:hover .spark{animation-duration:400ms}
  html[data-tag="b"] .tab{align-items:center;text-align:center;padding:12px 16px}
  html[data-tag="b"] .meta{justify-content:center;gap:6px}
  html[data-tag="b"] .meta .left::before{content:"\00B7";margin-right:6px}

  /* Round 5: the cycles as short segments over the words, and the study line smaller. */
  .cycles{display:flex;justify-content:center;gap:6px;height:3px}
  .cycles i{display:block;width:28px;height:3px;border-radius:2px;background:var(--paper-line);overflow:hidden}
  .cycles b{display:block;width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
  .study{margin:0;max-width:44ch;text-align:center;font-size:12px;line-height:16px;color:var(--paper-muted);text-decoration:none}
  .study::after{display:none}
  .study a{color:var(--paper-muted);text-decoration:underline;text-decoration-color:var(--paper-line);text-underline-offset:2px;
       transition:color var(--dur-ui) var(--ease-ui)}
  .study a:hover{color:var(--paper-ink);text-decoration-color:currentColor}

  /* ---- round 6 ---- */
  .study{font-size:10px;line-height:14px;font-style:italic;max-width:52ch}
  /* "2/4" and the time, small, under the bar. Hidden until a run starts; kept at the end. */
  .stage{position:relative}
  .pm{position:absolute;left:0;right:0;margin:0;display:none;justify-content:center;align-items:baseline;gap:6px;
       font-size:12px;line-height:16px;color:var(--paper-muted);font-variant-numeric:tabular-nums;pointer-events:none;
       opacity:0;transition:opacity var(--dur-scene) var(--ease-scene)}
  .is-running .pm,.is-done .pm{opacity:1}
  .pm .dot{opacity:.6}
  .pm-line{position:static;display:none;justify-content:space-between;font-size:11px;line-height:14px;margin-top:-2px}
  /* Levi 10-26 round 7: progress stays at the bottom, with the words and the button, so status and what to do are
     read in one place. */
  .pm-line{display:flex}
  @media (prefers-reduced-motion:reduce){.pm{transition-duration:.01ms}}

  
  </style>
</head>
<body>

  <main>
    <section class="layer is-on" id="menu" aria-label="breathing exercises">
      <header class="mast">
        <div>
          <p class="mast-title">breathing exercises</p>
        </div>
        <p class="mast-me">levi adissi</p>
      </header>
      <div class="list" id="list" role="group" aria-label="pick an exercise"></div>
      <footer class="foot"><a class="back" href="./">back to the site</a></footer>
    </section>

    <section class="layer" id="guide" aria-label="guide" inert>
      <header class="mast">
        <p class="mast-title" id="exName">breathing exercises</p>
        <p class="mast-me">levi adissi</p>
        <button type="button" class="linkish" id="back">back</button>
        <a class="back type-meta" href="./">back to the site</a>
      </header>
      <div class="pick">
        <h1 class="type-page-title">breathing exercises</h1>
        <div class="seg" role="tablist" aria-label="pick an exercise" id="seg"></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="disc" aria-hidden="true"></canvas>
        <p class="count" id="count" aria-hidden="true" hidden></p>
      </div>
      <div class="tray">
        <div class="cycles" id="cycles" aria-hidden="true"></div>
        <p class="cycle sr" id="cycle"></p>
        <p class="left" id="left" hidden></p>
        <div class="phase" aria-hidden="true">
          <div class="phase-words" id="words"></div>
          <div class="bar" id="bar"><i class="bar-ghost" id="ghost"></i><i class="bar-fill" id="fill"></i></div>
          <p class="pm pm-line"><span class="m-cyc"></span><span class="m-left"></span></p>
        </div>
        <button type="button" class="go" id="go">begin</button>
        <p class="study">based on <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947/" target="_blank" rel="noopener">brief structured respiration practices enhance mood and reduce physiological arousal<span class="sr"> (opens in a new tab)</span></a></p>
      </div>
      <p class="sr" role="status" id="say"></p>
    </section>
  </main>

  <script type="module">
    "use strict";

    /* ---------- shared ---------- */

    const DPR = Math.min(2, window.devicePixelRatio || 1);
    const mqRM = window.matchMedia("(prefers-reduced-motion: reduce)");

    const smooth = k => k * k * (3 - 2 * k);
    // Exponential approach, frame-rate independent.
    const approach = (dt, rate) => 1 - Math.exp(-dt * rate);

    // The disc is painted on a canvas, so it cannot inherit a custom property.
    // It reads the token once rather than carrying a second copy of the value,
    // which is the rule that keeps a hued literal from creeping in sideways.
    function rgbOf(name) {
      const hex = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(",");
    }
    const INK = rgbOf("--disc"); const DA = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--disc-a"));

    /* ---------- the exercises ---------- */

    // Every exercise is data. There is one engine below and no per-exercise
    // animation code, which is what lets the physiological sigh exist at all:
    // it is not an in-hold-out template with an exception bolted on, it is a
    // three phase cycle whose second phase happens to be another inhale.
    //
    // `disc` is where that phase ENDS, 0 empty to 1 full. A phase eases from
    // wherever the phase before it left the disc, so a hold is simply a phase
    // that ends where the last one did, and the sigh's top-up is a phase that
    // starts at 0.85 and ends at 1.
    const EXERCISES = [
      {
        slug: "box",
        name: "box breathing",
        line: "four in, four hold, four out, four hold.",
        pill: { name: "mood enhancer", effect: "mood up 5% of the scale per 5 min dose." },
        cycles: 4,
        phases: [
          { label: "in",   seconds: 4, disc: 1 },
          { label: "hold", seconds: 4, disc: 1 },
          { label: "out",  seconds: 4, disc: 0 },
          { label: "hold", seconds: 4, disc: 0 },
        ],
      },
      {
        slug: "sigh",
        name: "physiological sigh",
        line: "a second breath in on top of a full one, then a long breath out.",
        pill: { name: "stress reliever", effect: "anxiety down 6% of the scale per 5 min dose." },
        cycles: 3,
        phases: [
          { label: "in",       seconds: 2.5, disc: 0.85 },
          { label: "in again", seconds: 1,   disc: 1 },
          { label: "out",      seconds: 6,   disc: 0 },
        ],
      },
    ];

    const cycleSeconds = ex => ex.phases.reduce((s, p) => s + p.seconds, 0);
    const totalSeconds = ex => cycleSeconds(ex) * ex.cycles;
    function human(sec) {
      const s = Math.round(sec);
      return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
    }

    /* ---------- elements ---------- */

    const menuEl = document.getElementById("menu");
    const guideEl = document.getElementById("guide");
    const listEl = document.getElementById("list");
    const nameEl = document.getElementById("exName");
    const wordsEl = document.getElementById("words");
    const fillEl = document.getElementById("fill");
    const ghostEl = document.getElementById("ghost");
    const leftEl = document.getElementById("left");
    const cyclesEl = document.getElementById("cycles");
    let cSegs = [];
    const trayEl = document.querySelector(".tray");
    const cycleEl = document.getElementById("cycle");
    const countEl = document.getElementById("count");
    const goEl = document.getElementById("go");
    const backEl = document.getElementById("back");
    const stageEl = document.getElementById("stage");
    const sayEl = document.getElementById("say");
    const canvas = document.getElementById("disc");
    const ctx = canvas.getContext("2d");

    // A press arms on pointerdown, not on click. A click on a touch screen is
    // the browser's opinion about what you meant several hundred milliseconds
    // later, and the first thing anyone does with `begin` is stab it. The click
    // path stays for the keyboard, where there is no pointerdown to arm on.
    function press(el, fn) {
      let armed = false, t = 0;
      el.addEventListener("pointerdown", e => {
        if (e.isPrimary === false) return;
        armed = true;
        clearTimeout(t);
        // A pointerdown that never becomes a click (a finger dragged off the
        // control) must not swallow the next keyboard press.
        t = setTimeout(() => { armed = false; }, 800);
        fn();
      });
      el.addEventListener("click", () => {
        if (armed) { armed = false; clearTimeout(t); return; }
        fn();
      });
    }

    /* ---------- menu ---------- */

    // Built from the data, so a row can never advertise a length the engine
    // does not run.
    for (const ex of EXERCISES) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.ex = ex.slug;
      const top = document.createElement("span");
      top.className = "row-top";
      const n = document.createElement("span");
      n.className = "row-name";
      n.textContent = ex.name;
      const t = document.createElement("span");
      t.className = "row-time";
      t.textContent = `${ex.cycles} cycles, ${human(totalSeconds(ex))}`;
      top.append(n, t);
      const line = document.createElement("span");
      line.className = "row-line";
      line.textContent = ex.line;
      const pill = document.createElement("p");
      pill.className = "row-pill";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.dataset.slot = "badge";
      const glint = document.createElement("span");
      glint.className = "glint";
      glint.setAttribute("aria-hidden", "true");
      const word = document.createElement("span");
      word.className = "badge-word";
      word.textContent = ex.pill.name;
      badge.append(glint, word);
      for (const el of [b, pill]) {
        el.addEventListener("pointerenter", () => sweep(glint));
        el.addEventListener("pointerdown", () => sweep(glint));
        el.addEventListener("focusin", () => sweep(glint));
      }
      const effect = document.createElement("span");
      const cite = document.createElement("a");
      cite.href = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947/";
      cite.textContent = "balban et al. 2023";
      effect.append(`${ex.pill.effect} `, cite, ".");
      pill.append(badge, effect);
      b.append(top, line);
      b.addEventListener("click", () => open(ex));
      listEl.append(b, pill);
    }

    // The pill glint. One sweep is 1.2s; on its own the pills take turns every 2s. The turn is skipped while the
    // menu is not the layer showing, the list is out of view, or the tab is hidden, and nothing moves at all under
    // reduced motion (the CSS holds the glint still as a gloss).
    const GLINT_MS = 1200, GLINT_TURN = 2000;
    function sweep(g) {
      if (mqRM.matches || (g.sweeping && g.sweeping.playState === "running")) return;
      g.sweeping = g.animate([{ backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0" }],
        { duration: GLINT_MS, easing: "ease-in-out" });
    }
    let glintTurn = 0, listSeen = false;
    new IntersectionObserver(es => { listSeen = es[es.length - 1].isIntersecting; }).observe(listEl);
    setInterval(() => {
      if (!listSeen || document.hidden || !menuEl.classList.contains("is-on")) return;
      const gs = listEl.querySelectorAll(".glint");
      if (gs.length) sweep(gs[glintTurn++ % gs.length]);
    }, GLINT_TURN);

    /* ---------- the engine ---------- */

    let ex = null;
    let running = false, done = false;
    let t0 = 0, phaseIdx = -1, cycleIdx = 0;
    let discCur = 0, fillCur = 0;
    let frames = 0, ticks = 0;      // rAF frames, and reduced-motion ticks
    let raf = 0, rmT = 0, lastNow = 0;
    let cycleMarks = [], phaseMarks = [];
    let spans = [];

    // Where the run is at `el` seconds: which cycle, which phase, and how far
    // into it. Everything on screen is derived from this and from one
    // performance.now() origin, so the disc and the bar cannot drift apart and
    // neither can drift from the wall clock.
    function locate(el) {
      const cs = cycleSeconds(ex);
      if (el >= cs * ex.cycles) return null;         // the run is over
      const cycle = Math.floor(el / cs);
      let t = el - cycle * cs;
      for (let i = 0; i < ex.phases.length; i++) {
        const p = ex.phases[i];
        if (t < p.seconds || i === ex.phases.length - 1) {
          return { cycle, i, p, t: Math.min(t, p.seconds) };
        }
        t -= p.seconds;
      }
      return null;
    }
    // A phase eases from wherever the previous one left the disc. The first
    // phase of a cycle follows the last phase of the one before it, which is
    // also the rest value at the start of a run.
    function discAt(loc) {
      const ph = ex.phases;
      const from = loc.i === 0 ? ph[ph.length - 1].disc : ph[loc.i - 1].disc;
      return from + (loc.p.disc - from) * smooth(loc.t / loc.p.seconds);
    }

    function setPhase(loc) {
      if (loc.i !== phaseIdx || loc.cycle !== cycleIdx) {
        if (loc.cycle !== cycleIdx || phaseIdx < 0) {
          cycleIdx = loc.cycle;
          cycleMarks.push(performance.now());
        }
        phaseIdx = loc.i;
        phaseMarks.push(performance.now());
        for (let i = 0; i < spans.length; i++) spans[i].classList.toggle("is-now", i === loc.i);
        // The word that starts settles in from a touch smaller, and the bar the last phase filled lets go as a
        // fading ghost rather than snapping back to empty.
        if (!mqRM.matches) {
          spans[loc.i].animate([{ transform: "scale(.94)" }, { transform: "scale(1)" }],
            { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" });
          if (loc.i === 0 && phaseMarks.length > 1) ghostEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 520, easing: "ease-out" });
        }
        // Label only, once per phase. The countdown is not announced: a screen
        // reader reciting "three, two, one" over a breath is noise.
        sayEl.textContent = loc.p.label;
        cycleEl.textContent = `cycle ${loc.cycle + 1} of ${ex.cycles}`;
      }
    }
    // v is how far into the running phase. One bar under the words fills across the phase that is running.
    // The line above it says where the session is: the cycle on the left, the time left on the right.
    const clock = sec => { const t = Math.max(0, Math.ceil(sec - 1e-6)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
    function setFill(v, loc) {
      fillCur = v;
      // The fill runs across the whole cycle, an equal share per word, so its edge is always under the word that
      // is running.
      fillEl.style.transform = `scaleX(${loc && ex ? (loc.i + v) / ex.phases.length : 0})`;
      if (ex) {
        let past = 0;
        if (loc) for (let i = 0; i < loc.i; i++) past += ex.phases[i].seconds;
        const cf = loc ? (past + v * loc.p.seconds) / cycleSeconds(ex) : 0;
        prog.n = ex.cycles; prog.on = !!loc; prog.cycle = loc ? loc.cycle : 0; prog.cf = cf;
        prog.sf = loc ? (loc.cycle + cf) / ex.cycles : 0;
        if (loc) {
          setText(`${loc.cycle + 1}/${ex.cycles}`, clock(totalSeconds(ex) - (loc.cycle + cf) * cycleSeconds(ex)),
                  String(Math.max(1, Math.ceil(loc.p.seconds * (1 - v) - 1e-6))));
        }
      }
      // The cycles: one short segment each, filling as its cycle runs.
      if (ex) {
        let past = 0;
        if (loc) for (let i = 0; i < loc.i; i++) past += ex.phases[i].seconds;
        const cf = loc ? (past + v * loc.p.seconds) / cycleSeconds(ex) : 0;
        for (let c = 0; c < cSegs.length; c++) {
          const f = trayEl.classList.contains("is-done") ? 1 : !loc ? 0 : c < loc.cycle ? 1 : c === loc.cycle ? cf : 0;
          cSegs[c].style.transform = `scaleX(${f})`;
        }
      }
      trayEl.classList.toggle("is-running", !!loc);
      guideEl.classList.toggle("is-running", !!loc);
      if (!loc || !ex) return;
      let into = 0;
      for (let i = 0; i < loc.i; i++) into += ex.phases[i].seconds;
      const t = clock(totalSeconds(ex) - loc.cycle * cycleSeconds(ex) - into - v * loc.p.seconds);
      if (leftEl.textContent !== t) leftEl.textContent = t;
    }
    function segs(el, n) {
      el.textContent = "";
      return Array.from({ length: n }, () => {
        const i = document.createElement("i"), b = document.createElement("b");
        i.append(b); el.append(i);
        return b;
      });
    }

    /* ---------- the disc ---------- */

    let w = 0, h = 0;
    function fitCanvas() {
      const r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
      const cw = Math.round(w * DPR), ch = Math.round(h * DPR);
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    // Levi 10-26: the disc is alive. Three translucent layers, each its own slowly turning blob, drift around
    // the centre; where they overlap they add up to the old disc's density, so the body reads as before and the
    // edge is what moves. The soft edge is a shadow blur, which every browser draws (canvas filter is not
    // everywhere). Under reduced motion it is one still shape.
    const LA = 1 - Math.pow(1 - DA, 1 / 3);
    const LAYERS = [
      { a: [0.034, 0.020, 0.012], f: [0.23, -0.17, 0.31], p: [0.0, 2.1, 4.2], s: 0.11, o: 0.0 },
      { a: [0.028, 0.026, 0.010], f: [-0.19, 0.27, -0.23], p: [1.3, 0.4, 2.9], s: 0.09, o: 2.1 },
      { a: [0.030, 0.016, 0.016], f: [0.15, 0.21, -0.29], p: [3.7, 5.0, 0.8], s: 0.13, o: 4.2 },
    ];
    const OFF = 100000;
    // The orb is glow, from breathe-orbs.js (Levi 10-26). If that module cannot load, the disc below is drawn instead.
    // Levi 10-26: the orb answers the pointer, a little. ptr is eased toward the pointer (±1 = the stage's half
    // size) and back to the centre when it leaves; the loop does the easing.
    const ptr = { x: 0, y: 0, h: 0, tx: 0, ty: 0, th: 0 };
    function easePtr(dt) {
      const k = approach(dt, 5);
      ptr.x += (ptr.tx - ptr.x) * k; ptr.y += (ptr.ty - ptr.y) * k; ptr.h += (ptr.th - ptr.h) * k;
    }
    let ORBS = {};
    try { ({ ORBS } = await import("./breathe-orbs.js")); } catch (e) { console.warn("orbs", e); }
    function drawDisc(v, time = 0, amp = 0) {
      drawOrb(v, time, amp);
    }
    function drawOrb(v, time = 0, amp = 0) {
      const O = ORBS.glow;
      const rm = mqRM.matches;
      if (O) { ctx.clearRect(0, 0, w, h); O.draw(ctx, { w, h, v, time, amp, dpr: DPR, ink: INK, rm, mx: rm ? 0 : ptr.x, my: rm ? 0 : ptr.y, hover: rm ? 0 : ptr.h }); return; }
      ctx.clearRect(0, 0, w, h);
      const r = Math.min(w, h) * 0.30 * (0.55 + 0.45 * v);
      if (r <= 0) return;
      const blur = Math.max(4, r * 0.07);
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.shadowColor = `rgba(${INK},${LA})`;
      ctx.shadowBlur = blur * DPR;
      ctx.shadowOffsetX = OFF * DPR;
      for (const L of LAYERS) {
        const lean = rm ? 0 : r * 0.04 * amp;
        const cx = w / 2 + r * 0.07 * amp * Math.sin(time * L.s * 6.283 + L.o) + lean * ptr.x - OFF;
        const cy = h / 2 + r * 0.055 * amp * Math.cos(time * L.s * 8.17 + L.o) + lean * ptr.y;
        ctx.beginPath();
        for (let k = 0; k <= 120; k++) {
          const th = k / 120 * Math.PI * 2;
          const m = 1 + 1.5 * amp * (L.a[0] * Math.sin(2 * th + L.p[0] + L.f[0] * time)
                             + L.a[1] * Math.sin(3 * th + L.p[1] + L.f[1] * time)
                             + L.a[2] * Math.sin(5 * th + L.p[2] + L.f[2] * time));
          const rr = (r - blur * 0.5) * m;
          const x = cx + rr * Math.cos(th), y = cy + rr * Math.sin(th);
          if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    // Levi 10-26 round 7: progress lives in the tray, not round the orb. prog still feeds the finish.
    const prog = { sf: 0, cf: 0, cycle: 0, n: 4, on: false, done: false };
    const TAU = Math.PI * 2;
    // Before begin, and after a run, the disc breathes on its own: an 8 second breath between a small and a
    // middle size, slower than any exercise, so it reads as waiting rather than as a cue to follow.
    const idleAt = time => 0.3 - 0.22 * Math.cos(time * Math.PI * 2 / 8);

    /* ---------- the two drivers ---------- */

    // Motion: one rAF loop, and it exists only while there is something to
    // move. At rest nothing is scheduled.
    function loop(now) {
      frames++;
      const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
      lastNow = now;
      const time = now / 1000;
      if (running) {
        // Clamped at zero: a rAF timestamp is the time the frame STARTED, which
        // can precede the click that set the origin by a millisecond or two. A
        // negative elapsed walks locate() backwards into the previous cycle, so
        // the run would open by announcing the last phase for one frame and
        // would count a cycle boundary that never happened.
        const loc = locate(Math.max(0, (now - t0) / 1000));
        if (!loc) { settle(); }
        else {
          setPhase(loc);
          setFill(loc.t / loc.p.seconds, loc);
          // The first 700ms ease from the idle breath into the exercise's own first phase.
          const k = smooth(Math.min(1, (now - t0) / 700));
          discCur = blendFrom + (discAt(loc) - blendFrom) * k;
        }
      } else {
        // At rest the disc settles back into the idle breath rather than dropping.
        discCur += (idleAt(time) - discCur) * approach(dt, 3);
      }
      easePtr(dt);
      stepPress(dt);
      drawDisc(Math.max(0, discCur + squish.s), time, 1);
      drawBloom(now);
      raf = requestAnimationFrame(loop);
    }
    let blendFrom = 0;
    function idle() {
      stopDrivers();
      if (mqRM.matches) { drawDisc(discCur); return; }
      lastNow = performance.now();
      raf = requestAnimationFrame(loop);
    }

    // Reduced motion: no rAF at all, and no smooth clock. The phase label, a
    // whole-second countdown, and a bar that steps once a second. Each tick is
    // scheduled against the run's single origin rather than against the last
    // tick, so an early or late timer cannot accumulate.
    function rmTick() {
      ticks++;
      const el = (performance.now() - t0) / 1000;
      const loc = locate(el);
      if (!loc) { settle(); return; }
      setPhase(loc);
      setFill(Math.min(1, Math.floor(loc.t + 1e-6) / loc.p.seconds), loc);
      countEl.textContent = String(Math.max(1, Math.ceil(loc.p.seconds - loc.t - 1e-6)));
      drawDisc(discCur);
      const next = Math.min(Math.floor(loc.t + 1e-6) + 1, loc.p.seconds);
      rmT = setTimeout(rmTick, Math.max(30, (next - loc.t) * 1000));
    }

    /* ---------- begin, end, again ---------- */

    function begin() {
      if (running) return;
      stopDrivers();
      running = true; done = false;
      t0 = performance.now();
      lastNow = t0;
      blendFrom = discCur;
      phaseIdx = -1; cycleIdx = 0;
      cycleMarks = []; phaseMarks = [];
      goEl.textContent = "end";
      trayEl.classList.remove("is-done"); guideEl.classList.remove("is-done"); prog.done = false;
      for (const b of cSegs) b.style.transform = "scaleX(0)";
      if (mqRM.matches) {
        countEl.hidden = false;
        rmTick();
      } else {
        countEl.hidden = true;
        raf = requestAnimationFrame(loop);
      }
    }
    // At rest the line above the words reads "4 cycles" and the whole length. Finished, it reads "done" with a
    // check that draws itself in.
    // "1/4" and the time left in the session, under the bar.
    const lastText = ["", "", ""];
    function setText(cyc, left, sec) {
      const vals = [cyc, left, sec];
      ["m-cyc", "m-left", "m-sec"].forEach((c, i) => {
        if (lastText[i] === vals[i]) return;
        lastText[i] = vals[i];
        for (const el of document.getElementsByClassName(c)) el.textContent = vals[i];
      });
    }
    function restMeta(finished) {
      trayEl.classList.toggle("is-done", !!finished);
      guideEl.classList.toggle("is-done", !!finished);
      prog.done = !!finished; prog.on = false;
      setText(finished ? `${ex.cycles}/${ex.cycles}` : `${ex.cycles} cycles`, clock(finished ? 0 : totalSeconds(ex)), "");
      cycleEl.innerHTML = finished
        ? `<svg class="tick" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.4l2.6 2.6L11 4.6"/></svg>done, ${ex.cycles} cycles`
        : `${ex.cycles} cycles`;
      leftEl.textContent = clock(totalSeconds(ex));
      if (cSegs.length !== ex.cycles) {
        cyclesEl.textContent = "";
        cSegs = Array.from({ length: ex.cycles }, () => {
          const i = document.createElement("i"), b = document.createElement("b");
          i.append(b); cyclesEl.append(i);
          return b;
        });
      }
      for (const b of cSegs) b.style.transform = `scaleX(${finished ? 1 : 0})`;
    }
    // The finish: the disc sends out one soft ring that widens and fades, and the phase words light in turn.
    // Levi 10-26: no circles on a tap. The orb gives a little and springs back, a spring on its size stepped in the loop.
    const squish = { s: 0, vel: 0 };
    function stepPress(dt) {
      // stiff, about a third of a second, one small overshoot
      const acc = -260 * squish.s - 16 * squish.vel;
      squish.vel += acc * dt; squish.s += squish.vel * dt;
      if (Math.abs(squish.s) < 1e-4 && Math.abs(squish.vel) < 1e-3) squish.s = squish.vel = 0;
    }
    let bloomAt = -1;
    function celebrate() {
      if (mqRM.matches) return;
      bloomAt = performance.now();
      cSegs.forEach((b, i) => b.parentNode.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(2.2)" }, { transform: "scaleY(1)" }],
        { duration: 520, delay: 200 + i * 90, easing: "cubic-bezier(.34,1.56,.64,1)" }));
      spans.forEach((sp, i) => sp.animate([{ color: "var(--accent)" }, { color: "var(--paper-muted)" }],
        { duration: 700, delay: i * 90, easing: "ease-out" }));
    }
    function drawBloom(now) {
      if (bloomAt < 0) return;
      const k = (now - bloomAt) / 1600;
      if (k >= 1) { bloomAt = -1; return; }
      const e = 1 - Math.pow(1 - k, 3);
      const r0 = Math.min(w, h) * 0.30 * (0.55 + 0.45 * discCur);
      ctx.save();
      ctx.shadowColor = `rgba(${INK},.35)`;
      ctx.shadowBlur = 10 * DPR;
      for (const [lag, a] of [[0, 0.22], [0.2, 0.1]]) {
        const kk = Math.max(0, (k - lag) / (1 - lag));
        if (!kk) continue;
        const ee = 1 - Math.pow(1 - kk, 3);
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, r0 * (1 + 0.55 * ee), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${INK},${a * (1 - kk)})`;
        ctx.lineWidth = 1 + 3 * (1 - kk);
        ctx.stroke();
      }
      ctx.restore();
    }
    // Both the hand-stopped end and the finished end land here. The difference
    // is only what the button offers next.
    function stop(finished) {
      if (!running) return;
      running = false;
      done = !!finished;
      stopDrivers();
      for (const s of spans) s.classList.remove("is-now");
      setFill(0, null);
      if (finished) celebrate();
      sayEl.textContent = finished ? "done" : "stopped";
      goEl.textContent = finished ? "again" : "begin";
      restMeta(finished);
      countEl.hidden = true;
      countEl.textContent = "";
      if (mqRM.matches) discCur = 0;
      idle();
    }
    const settle = () => stop(true);
    function stopDrivers() {
      cancelAnimationFrame(raf); raf = 0;
      clearTimeout(rmT); rmT = 0;
    }

    /* ---------- the two screens ---------- */

    let onGuide = false, opener = null, booted = false;

    function open(next) {
      ex = next;
      opener = listEl.querySelector(`[data-ex="${next.slug}"]`);
      nameEl.textContent = next.name;
      wordsEl.textContent = "";
      spans = next.phases.map(p => {
        const s = document.createElement("span");
        s.textContent = p.label;
        wordsEl.append(s);
        return s;
      });
      running = false; done = false;
      stopDrivers();
      phaseIdx = -1; cycleIdx = 0;
      cycleMarks = []; phaseMarks = [];
      setFill(0);
      goEl.textContent = "begin";
      restMeta(false);
      countEl.hidden = true; countEl.textContent = "";
      sayEl.textContent = "";
      onGuide = true;
      menuEl.classList.remove("is-on"); menuEl.inert = true;
      guideEl.classList.add("is-on"); guideEl.inert = false;
      // Nothing autoplays. The guide opens at rest with one word on it, and
      // focus goes to that word so a keyboard lands where a finger would.
      if (booted) goEl.focus();
      requestAnimationFrame(() => { fitCanvas(); if (mqRM.matches) { discCur = 0; drawDisc(0); } else if (!raf) idle(); });
    }
    function toMenu() {
      stop(false);
      running = false;
      stopDrivers();
      discCur = 0;
      onGuide = false;
      guideEl.classList.remove("is-on"); guideEl.inert = true;
      menuEl.classList.add("is-on"); menuEl.inert = false;
      if (opener) opener.focus();
    }

    press(goEl, () => { if (running) stop(false); else begin(); });
    backEl.addEventListener("click", toMenu);
    // Levi 10-26: the orb answers a tap: it gives a little and springs back. A tap never ends the run; only "end" does.
    stageEl.addEventListener("pointerdown", () => {
      if (mqRM.matches) return;
      squish.vel -= 1.4;
    });
    // The pointer anywhere on the page counts; the orb's pull is measured from the stage's centre.
    window.addEventListener("pointermove", e => {
      const r = stageEl.getBoundingClientRect();
      const x = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      const y = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      ptr.tx = Math.max(-1, Math.min(1, x)); ptr.ty = Math.max(-1, Math.min(1, y));
      ptr.th = Math.abs(x) < 1 && Math.abs(y) < 1 ? 1 : 0;
    });
    document.documentElement.addEventListener("pointerleave", () => { ptr.tx = ptr.ty = ptr.th = 0; });

    /* ---------- boot ---------- */

    function resize() {
      fitCanvas();
      if (mqRM.matches) drawDisc(discCur);
    }
    window.addEventListener("resize", resize);
    // The stage changes size with no window resize: the web font rewraps the
    // copy above it after boot. A stale canvas draws the disc as an oval.
    new ResizeObserver(resize).observe(canvas);

    function setMode() {
      if (!running) { if (mqRM.matches) discCur = 0; idle(); return; }
      // Switching the OS toggle mid-run keeps the run: the origin does not
      // move, only which driver is reading it.
      stopDrivers();
      if (mqRM.matches) { countEl.hidden = false; rmTick(); }
      else { countEl.hidden = true; lastNow = performance.now(); raf = requestAnimationFrame(loop); }
    }
    mqRM.addEventListener("change", setMode);

    fitCanvas();
    drawDisc(0);

    // B and C: one screen. The picker calls the page's own open(); the facts
    // block shows the picked exercise's menu row, moved, not re-written.
    const segEl = document.getElementById("seg");
    const factsEl = document.getElementById("facts");
    const rowOf = slug => {
      const b = listEl.querySelector(`[data-ex="${slug}"]`);
      return { b, pill: b.nextElementSibling };
    };
    function pick(next) {
      if (running) stop(false);
      open(next);
      for (const t of segEl.querySelectorAll("[role=tab]")) t.setAttribute("aria-selected", String(t.dataset.ex === next.slug));
      if (factsEl) {
        const { b, pill } = rowOf(next.slug);
        factsEl.innerHTML = "";
        const top = document.createElement("div");
        top.className = "top";
        const line = b.querySelector(".row-line").cloneNode(true);
        line.className = "type-body";
        line.style.color = "var(--paper-muted)";
        const time = b.querySelector(".row-time").cloneNode(true);
        time.className = "type-meta num";
        top.append(line, time);
        const p = pill.cloneNode(true);
        p.querySelectorAll(".glint").forEach(g => g.remove());
        factsEl.append(top, p);
      }
    }
    const STUDY = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947/";
    for (const e of EXERCISES) {
      const card = document.createElement("div");
      card.className = "tab";
      card.setAttribute("role", "none");
      const t = document.createElement("button");
      t.type = "button";
      t.setAttribute("role", "tab");
      t.dataset.ex = e.slug;
      t.textContent = e.name;
      t.addEventListener("click", () => pick(e));
      // Levi 10-26: the tag is a detail, not a link: a tap on it picks the exercise like the rest of the tab.
      // The study is linked once, under begin.
      const pillA = document.createElement("span");
      pillA.className = "pill-link";
      const badge = document.createElement("span");
      badge.className = "badge";
      const glint = document.createElement("span");
      glint.className = "glint";
      glint.setAttribute("aria-hidden", "true");
      const word = document.createElement("span");
      word.className = "badge-word";
      word.id = `pill-${e.slug}`;
      word.textContent = e.pill.name;
      const spark = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      spark.setAttribute("class", "spark");
      spark.setAttribute("viewBox", "0 0 12 12");
      spark.setAttribute("aria-hidden", "true");
      spark.innerHTML = '<path d="M6 0C6.4 3.6 8.4 5.6 12 6 8.4 6.4 6.4 8.4 6 12 5.6 8.4 3.6 6.4 0 6 3.6 5.6 5.6 3.6 6 0Z" fill="currentColor"/>';
      badge.append(glint, spark, word);
      pillA.append(badge);
      t.setAttribute("aria-describedby", word.id);
      card.addEventListener("pointerenter", () => sweep(glint));
      t.addEventListener("focus", () => sweep(glint));
      card.append(t, pillA);
      segEl.append(card);
    }
    pick(EXERCISES[0]);
    booted = true;

    // The picker is centred (Levi 10-26 picked layout b).
    document.documentElement.dataset.tag = "b";

    // The tab pills take turns shining on their own, one every 2.4s, while the picker is in view.
    let segTurn = 0, segSeen = false;
    new IntersectionObserver(es => { segSeen = es[es.length - 1].isIntersecting; }).observe(segEl);
    setInterval(() => {
      if (!segSeen || document.hidden || running) return;
      const gs = segEl.querySelectorAll(".glint");
      if (gs.length) sweep(gs[segTurn++ % gs.length]);
    }, 2400);


    // The probe surface, in the shape form.html already uses: enough to assert
    // on from the outside, nothing the page itself reads, and no way to drive
    // the page from it.
    window.__breathe = () => ({
      screen: onGuide ? "guide" : "menu",
      ex: ex ? ex.slug : null,
      running, done, rm: mqRM.matches,
      frames, ticks,
      elapsed: running ? +((performance.now() - t0) / 1000).toFixed(3) : 0,
      cycle: cycleIdx, phase: phaseIdx,
      label: phaseIdx >= 0 && ex ? ex.phases[phaseIdx].label : null,
      disc: +discCur.toFixed(4),
      fill: +fillCur.toFixed(4),
      count: countEl.hidden ? null : countEl.textContent,
      say: sayEl.textContent,
      go: goEl.textContent,
      cycleSeconds: ex ? cycleSeconds(ex) : 0,
      totalSeconds: ex ? totalSeconds(ex) : 0,
      cycleMarks: cycleMarks.map(m => +m.toFixed(3)),
      phaseMarks: phaseMarks.map(m => +m.toFixed(3)),
    });
    window.__breatheReady = true;
  </script>
</body>
</html>
